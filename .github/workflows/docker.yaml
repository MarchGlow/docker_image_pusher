name: Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'images.txt'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 查看磁盘空间
      # ============================================================

      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # ============================================================
      # 增加 Docker 可用磁盘空间
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          # remove-android: 'true'
          # remove-codeql: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@v4

      # ============================================================
      # Docker Buildx
      # ============================================================

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # 镜像同步
      # ============================================================

      - name: Build and push image Aliyun
        shell: bash
        run: |

          set -e

          # ========================================================
          # 登录阿里云镜像仓库
          # ========================================================

          echo "========================================"
          echo "登录阿里云镜像仓库"
          echo "========================================"

          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
            -u "$ALIYUN_REGISTRY_USER" \
            --password-stdin \
            "$ALIYUN_REGISTRY"


          # ========================================================
          # 第一阶段
          #
          # 分析 images.txt
          #
          # 用于判断：
          #
          # nginx:1.31
          # docker.io/nginx:1.31
          #
          # kasmweb/nginx:1.31
          # nginx:1.31
          #
          # 是否存在同名镜像
          # ========================================================

          echo ""
          echo "========================================"
          echo "开始分析镜像名称"
          echo "========================================"

          declare -A duplicate_images
          declare -A temp_map

          while IFS= read -r line || [ -n "$line" ]; do

              # 忽略空行
              [[ -z "$line" ]] && continue

              # 忽略注释
              if echo "$line" | grep -q '^\s*#'; then
                  continue
              fi

              # 获取完整镜像名称
              image=$(echo "$line" | awk '{print $NF}')

              # 删除 digest
              image="${image%%@*}"

              echo ""
              echo "image: $image"

              # 获取镜像名:tag
              #
              # kasmweb/nginx:1.25.3
              #       ↓
              # nginx:1.25.3
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')

              echo "image_name_tag: $image_name_tag"

              # 获取 namespace
              #
              # kasmweb/nginx:1.25.3
              #       ↓
              # kasmweb
              #
              # docker.io/library/nginx:1.31
              #       ↓
              # library
              #
              # nginx:1.31
              #       ↓
              # 空
              name_space=$(echo "$image" | awk -F'/' '{
                  if (NF==3)
                      print $2
                  else if (NF==2)
                      print $1
                  else
                      print ""
              }')

              # 避免空字符串影响判断
              name_space="${name_space}_"

              echo "name_space: $name_space"

              # 获取镜像名称
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

              echo "image_name: $image_name"

              # 判断是否存在相同 image_name，
              # 但 namespace 不同
              if [[ -n "${temp_map[$image_name]}" ]]; then

                  if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then

                      echo "duplicate image name: $image_name"

                      duplicate_images[$image_name]="true"

                  fi

              else

                  temp_map[$image_name]=$name_space

              fi

          done < images.txt


          # ========================================================
          # 第二阶段
          #
          # 开始同步镜像
          # ========================================================

          echo ""
          echo "========================================"
          echo "开始同步镜像"
          echo "========================================"

          while IFS= read -r line || [ -n "$line" ]; do

              # ====================================================
              # 忽略空行
              # ====================================================

              [[ -z "$line" ]] && continue

              # ====================================================
              # 忽略注释
              # ====================================================

              if echo "$line" | grep -q '^\s*#'; then
                  continue
              fi


              echo ""
              echo "============================================================"
              echo "处理镜像: $line"
              echo "============================================================"


              # ====================================================
              # 获取 platform
              #
              # 支持：
              #
              # --platform linux/amd64
              #
              # --platform=linux/amd64
              # ====================================================

              platform=$(echo "$line" \
                  | awk -F'--platform[ =]' '{if (NF>1) print $2}' \
                  | awk '{print $1}')

              echo "platform: $platform"


              if [ -z "$platform" ]; then

                  platform_prefix=""

              else

                  platform_prefix="${platform//\//_}_"

              fi

              echo "platform_prefix: $platform_prefix"


              # ====================================================
              # 获取原始镜像
              # ====================================================

              image=$(echo "$line" | awk '{print $NF}')

              original_image="$image"

              # 删除 digest
              image="${image%%@*}"

              echo "image: $image"


              # ====================================================
              # 获取 image:tag
              # ====================================================

              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')

              echo "image_name_tag: $image_name_tag"


              # ====================================================
              # 获取 namespace
              # ====================================================

              name_space=$(echo "$image" | awk -F'/' '{
                  if (NF==3)
                      print $2
                  else if (NF==2)
                      print $1
                  else
                      print ""
              }')

              echo "name_space: $name_space"


              # ====================================================
              # 获取 image name
              # ====================================================

              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

              echo "image_name: $image_name"


              # ====================================================
              # 判断是否需要 namespace 前缀
              # ====================================================

              name_space_prefix=""

              if [[ -n "${duplicate_images[$image_name]}" ]]; then

                  if [[ -n "$name_space" ]]; then

                      name_space_prefix="${name_space}_"

                  fi

              fi

              echo "name_space_prefix: $name_space_prefix"


              # ====================================================
              # 删除 digest
              # ====================================================

              image_name_tag="${image_name_tag%%@*}"


              # ====================================================
              # 生成阿里云目标镜像
              # ====================================================

              new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

              echo ""
              echo "源镜像:"
              echo "  $original_image"

              echo ""
              echo "目标镜像:"
              echo "  $new_image"


              # ====================================================
              # 判断是否 latest
              #
              # 例如：
              #
              # nginx:latest
              # mysql:latest
              #
              # 进入 latest 专用逻辑
              # ====================================================

              image_tag=$(echo "$image_name_tag" | awk -F':' '{if (NF>1) print $2; else print "latest"}')

              echo ""
              echo "image tag: $image_tag"


              # ====================================================
              # latest
              #
              # latest 不能简单判断“是否存在”
              #
              # 必须比较 digest
              # ====================================================

              if [[ "$image_tag" == "latest" ]]; then

                  echo ""
                  echo "检测到 latest 镜像"
                  echo "开始比较源镜像和阿里云镜像 digest"


                  # ------------------------------------------------
                  # 获取源镜像 digest
                  # ------------------------------------------------

                  source_digest=$(
                      docker buildx imagetools inspect "$image" 2>/dev/null \
                      | awk '/^Digest:/ {print $2; exit}'
                  ) || true


                  echo "源镜像 digest:"
                  echo "  $source_digest"


                  # ------------------------------------------------
                  # 获取阿里云 digest
                  #
                  # 如果阿里云不存在，命令会失败
                  # ------------------------------------------------

                  aliyun_digest=$(
                      docker buildx imagetools inspect "$new_image" 2>/dev/null \
                      | awk '/^Digest:/ {print $2; exit}'
                  ) || true


                  echo "阿里云 digest:"
                  echo "  $aliyun_digest"


                  # ------------------------------------------------
                  # 两边 digest 相同
                  # ------------------------------------------------

                  if [[ -n "$source_digest" ]] \
                    && [[ -n "$aliyun_digest" ]] \
                    && [[ "$source_digest" == "$aliyun_digest" ]]; then

                      echo ""
                      echo "========================================"
                      echo "latest 镜像 digest 相同"
                      echo "无需同步"
                      echo "========================================"

                      echo "source : $source_digest"
                      echo "aliyun : $aliyun_digest"

                      continue

                  fi


                  # ------------------------------------------------
                  # digest 不同或者阿里云不存在
                  # ------------------------------------------------

                  echo ""
                  echo "latest 镜像需要同步"

                  if [[ -z "$aliyun_digest" ]]; then
                      echo "原因：阿里云不存在该镜像"
                  elif [[ "$source_digest" != "$aliyun_digest" ]]; then
                      echo "原因：镜像 digest 已发生变化"
                  fi

              else

                  # =================================================
                  # 固定版本
                  #
                  # 例如：
                  #
                  # nginx:1.31
                  # mysql:8.4.11
                  #
                  # 只需要判断阿里云是否存在
                  # =================================================

                  echo ""
                  echo "检测到固定版本镜像"

                  if docker manifest inspect "$new_image" > /dev/null 2>&1; then

                      echo ""
                      echo "========================================"
                      echo "镜像已经存在"
                      echo "跳过同步"
                      echo "========================================"

                      echo "$new_image"

                      continue

                  fi

                  echo ""
                  echo "阿里云不存在该镜像"
                  echo "开始同步"

              fi


              # ====================================================
              # Pull
              # ====================================================

              echo ""
              echo "========================================"
              echo "开始 Pull"
              echo "========================================"

              echo "docker pull $line"

              docker pull $line


              # ====================================================
              # Tag
              # ====================================================

              echo ""
              echo "========================================"
              echo "开始 Tag"
              echo "========================================"

              echo "docker tag $image $new_image"

              docker tag "$image" "$new_image"


              # ====================================================
              # Push
              # ====================================================

              echo ""
              echo "========================================"
              echo "开始 Push"
              echo "========================================"

              echo "docker push $new_image"

              docker push "$new_image"


              # ====================================================
              # 清理 Docker 镜像
              # ====================================================

              echo ""
              echo "========================================"
              echo "开始清理磁盘空间"
              echo "========================================"

              df -hT

              # 删除源镜像
              docker rmi "$image" || true

              # 删除目标镜像
              docker rmi "$new_image" || true

              echo ""
              echo "磁盘空间清理完毕"

              df -hT


          done < images.txt
